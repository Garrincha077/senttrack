name: Positioning proxy backtest

on:
  push:
    branches: [positioning-proxy-backtest-v1]
    paths:
      - validation/backtest_positioning_proxy.py
      - .github/workflows/positioning-proxy-backtest.yml
  pull_request:
    branches: [main]
    paths:
      - validation/backtest_positioning_proxy.py
      - .github/workflows/positioning-proxy-backtest.yml

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: positioning-proxy-backtest-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy scipy requests beautifulsoup4 lxml openpyxl
      - name: Run rigorous positioning proxy backtest
        run: |
          mkdir -p validation-output
          python validation/backtest_positioning_proxy.py > validation-output/positioning_proxy_run.log 2>&1
          cat validation-output/positioning_proxy_run.log
      - name: Commit reproducible outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation-output/positioning_proxy_*
          if git diff --cached --quiet; then
            echo "No output changes"
          else
            git commit -m "Add positioning proxy backtest results"
            git push origin HEAD:positioning-proxy-backtest-v1
          fi
