name: Structural Crowding v1.2 backtest

on:
  push:
    branches: [structural-crowding-backtest-v1]
    paths:
      - validation/backtest_structural_crowding.py
      - validation/data/aaii_backtest_2024_2026.csv
      - .github/workflows/structural-crowding-backtest.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: structural-crowding-backtest-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy scipy requests beautifulsoup4 lxml html5lib openpyxl xlrd yfinance
      - name: Run research-only Structural/Crowding backtest
        run: |
          mkdir -p validation-output
          set +e
          python - <<'PY' > validation-output/structural_crowding_run.log 2>&1
          import sys
          from pathlib import Path
          import pandas as pd
          sys.path.insert(0, 'validation')
          import backtest_structural_crowding as bt

          original_download = bt.download_aaii
          pinned = Path('validation/data/aaii_backtest_2024_2026.csv')

          def download_aaii_with_fallback():
              try:
                  return original_download()
              except Exception as exc:
                  print(f'AAII official XLS unavailable ({type(exc).__name__}: {exc}); using pinned research slice.')
                  df = pd.read_csv(pinned)
                  df['release_date'] = pd.to_datetime(df['date'], errors='coerce')
                  df['bullish'] = pd.to_numeric(df['bullish'], errors='coerce') * 100.0
                  df['bearish'] = pd.to_numeric(df['bearish'], errors='coerce') * 100.0
                  df = df.dropna(subset=['release_date', 'bullish', 'bearish']).copy()
                  df['aaii_spread'] = df['bullish'] - df['bearish']
                  # The pinned dates are release/effective dates. The core script shifts
                  # survey_date to the next U.S. trading day, so backdate one day here.
                  df['survey_date'] = df['release_date'] - pd.Timedelta(days=1)
                  out = df[['survey_date', 'bullish', 'bearish', 'aaii_spread']].sort_values('survey_date')
                  if len(out) < 90:
                      raise RuntimeError(f'Pinned AAII slice unexpectedly short: {len(out)}')
                  return out

          bt.download_aaii = download_aaii_with_fallback
          bt.main()
          PY
          status=$?
          cat validation-output/structural_crowding_run.log
          echo "BACKTEST_EXIT=$status" >> "$GITHUB_ENV"
          exit 0
      - name: Commit reproducible research outputs to research branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation-output/structural_crowding_*
          if git diff --cached --quiet; then
            echo "No output changes to commit"
          else
            git commit -m "research: update structural crowding backtest outputs"
            git push origin HEAD:structural-crowding-backtest-v1
          fi
      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: structural-crowding-backtest-results
          path: validation-output/structural_crowding_*
          if-no-files-found: warn
          retention-days: 30
      - name: Fail if backtest failed
        if: always()
        run: |
          if [ "${BACKTEST_EXIT:-1}" != "0" ]; then
            echo "Backtest failed; see committed validation-output/structural_crowding_run.log"
            exit "${BACKTEST_EXIT:-1}"
          fi
