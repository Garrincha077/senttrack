name: COT v2 validation

on:
  push:
    branches: [cot-v2-validation]
    paths:
      - validation/validate_cot_v2.py
      - .github/workflows/cot-v2-validation.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cot-v2-validation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy scipy requests
      - name: Run frozen validation
        run: python validation/validate_cot_v2.py
      - name: Commit validation outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation-output
          if git diff --cached --quiet; then
            echo "No output changes"
          else
            git commit -m "Add COT v2 historical validation results"
            git push origin HEAD:cot-v2-validation
          fi
